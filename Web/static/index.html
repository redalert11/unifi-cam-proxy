<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body>
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
      <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6" href="#">UniFi Cam Proxy Supervisor</a>
      <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-nav">
        <div class="nav-item text-nowrap">
          <span class="nav-link px-3 text-light">alpha draft</span>
        </div>
      </div>
    </header>

    <div class="container-fluid">

          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <div class="d-flex align-items-center">
                  <a class="nav-link active" data-bs-toggle="tab" href="#dashboard" data-bs-target="#dashboard" role="tab">
                    <i class="bi bi-camera-video me-2"></i>Cameras
                  </a>
                  <button class="btn btn-sm btn-link text-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#camerasSubnav" aria-expanded="true" aria-controls="camerasSubnav">

                      <a class="nav-link small py-1" data-bs-toggle="tab" data-bs-target="#logs" href="#logs" role="tab">
                        <i class="bi bi-journal-text me-1"></i>Logs
                      </a>
                    </li>
                  </ul>

              </li>
              <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#web-logs" role="tab">

        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/static/js/app.js"></script>
