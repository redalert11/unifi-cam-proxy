<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3 border-bottom">
                <h1 class="h4">Webserver Logs</h1>
                <span class="badge text-bg-secondary" id="webLogPathBadge">path: -</span>
              </div>
              <div class="card shadow-sm">
                <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-terminal"></i>
                    <span class="fw-semibold">Webserver log tail</span>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <label class="form-label mb-0 small text-muted" for="webLogLines">lines</label>
                    <input type="number" class="form-control form-control-sm" id="webLogLines" value="200" min="10" max="2000" step="10" style="width: 90px;">
                    <select class="form-select form-select-sm" id="webLogLevel" style="width: 110px;">
                      <option value="ALL" selected>All levels</option>
                      <option value="INFO">Info+</option>
                      <option value="WARN">Warn+</option>
                      <option value="ERROR">Error</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary" id="webLogRefresh"><i class="bi bi-arrow-repeat me-1"></i>Refresh</button>
                    <button class="btn btn-sm btn-outline-success" id="webLogFollow"><i class="bi bi-play-fill me-1"></i>Follow</button>
                    <a class="btn btn-sm btn-outline-primary" id="webLogDownload" href="/api/web/logs/download" download>
                      <i class="bi bi-download me-1"></i>Download
                    </a>
                  </div>
                </div>
                <div class="card-body">
                  <pre class="bg-body-tertiary p-3 rounded small" style="max-height: 420px; overflow: auto;" id="webLogBox">Click Refresh to load the log.</pre>
                </div>
              </div>
