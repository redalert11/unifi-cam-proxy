<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3 border-bottom">
                <h1 class="h4">Cameras</h1>
                <div class="d-flex gap-2 align-items-center">
                  <span class="badge text-bg-info">Dashboard</span>
                  <select class="form-select form-select-sm w-auto" id="camGridSize" aria-label="Camera grid size">
                    <option value="1">1 per row</option>
                    <option value="2">2 per row</option>
                    <option value="3" selected>3 per row</option>
                    <option value="4">4 per row</option>
                    <option value="6">6 per row</option>
                  </select>
                  <button class="btn btn-outline-secondary btn-sm" id="camCardsRefresh"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
                </div>
              </div>
              <div class="row g-3" id="camCards"></div>
